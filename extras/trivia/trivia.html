<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="trivia.css" rel="stylesheet">
        <title>Trivia!</title>
        
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice</h2>
                <hr>
                <h3>What are the next digits of pi? 3.14___</h3>
                <div class="msg" style="font-weight: 900;"></div>
                <button class="x">195</button>
                <button class="x">256</button>
                <button class="x">156</button>
                <button id="correct">159</button>
                <button class="x">167</button>
                <button class="x">954</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>In which country is it illegal to handle salmon in suspicious circumstances?</h3>
                <div class="msg2" style="font-weight: 900;"></div>
                <input type="text" placeholder="Answer" id="freeinput">
                <button id="freebutton">Check Answer</button>
            </div>
        </div>
        <script>
            const msg = document.querySelector(".msg");
            const msg2 = document.querySelector(".msg2");
            const wrong = document.querySelectorAll(".x");
            const right = document.querySelector("#correct");
            const inpt = document.querySelector("#freeinput");
            const inpb = document.querySelector("#freebutton");
            function handle (el, res) {
                if (res === 1) {
                    wrong.forEach(e => {
                        e.style.background = "";
                    })
                    el.style.background = "lime";
                    msg.textContent = "Correct!"
                } else {
                    wrong.forEach(e => {
                        e.style.background = "";
                    });
                    right.style.background = "";
                    el.style.background = "red";
                    msg.textContent = "Incorrect!"
                }
            }
            wrong.forEach(x => {x.addEventListener("click", () => {handle(x,0);})});
            right.addEventListener("click", () => {handle(right, 1)});
            function check () {
                const res = inpt.value;
                if (res && (res.match(/^[uU]nited ?[Kk]ingdom$/) || res.match(/[uU][kK]/))) {
                    msg2.textContent = "Correct!";
                    inpt.style.borderColor = "lime";
                } else {
                    msg2.textContent = "Incorrect!";
                    inpt.style.borderColor = "red";
                }
            }
            inpb.addEventListener("click",()=>{check();})
        </script>
    </body>
</html>
