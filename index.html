const lockTime = document.getElementById('lock-time');
const homeTime = document.getElementById('home-time');
const homeButton = document.getElementById('home-button');
const iframeGoogle = document.getElementById('iframe-google')
const appGoogle = document.getElementById('appGoogle');
const appCalculator = document.getElementById('appCalculator');
const appBookmarklets = document.getElementById('appBookmarklets');
const appPaint = document.getElementById('appPaint');
const appRPS = document.getElementById('appRPS');
const appGifViewer = document.getElementById('appGifViewer');
const appPython = document.getElementById('appPython');
const appExtras = document.getElementById('appExtras');


screen.addEventListener('dblclick', function() {
    if (screen.classList.contains('home')) {
        screen.classList.toggle('home');
    } else if (!screen.classList.contains('app-google')) {
        screen.classList.toggle('lock');
    }
    buildDate();
});

const minDist = Math.round(screen.getBoundingClientRect().width*0.9);
screen.addEventListener('pointerdown', (e) => {
    let startX = e.clientX;
    let startY = e.clientY;
    let unlocked = false;
    screen.setPointerCapture(e.pointerId);
    const pointerMove = (e) => {
        if (unlocked) return;
        const dist = Math.sqrt((e.clientX-startX)**2+(e.clientY-startY)**2);
        let op = Math.max((minDist-dist),0)/minDist
        lockDate.style.opacity = op;
        lockTime.style.opacity = op;
        fingerprint.style.opacity = Math.min(0.75,op);
        if (dist >= minDist) {
            unlocked = true;
        }
    }
    const cleanUp = (e) => {
        screen.removeEventListener('pointermove', pointerMove);
        screen.removeEventListener('pointerup', cleanUp);
        screen.removeEventListener('pointercancel', cleanUp);
        lockDate.style.opacity = 1;
        lockTime.style.opacity = 1;
        fingerprint.style.opacity = 0.75;
        if (unlocked && screen.classList.contains('lock')) unlock();
        try {screen.releasePointerCapture(e.pointerId);}
        catch (err) {}
    };
    screen.addEventListener('pointermove', pointerMove);
    screen.addEventListener('pointerup', cleanUp);
    screen.addEventListener('pointercancel', cleanUp);
});

const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December']

function buildDate() {
    if (screen.classList.contains('lock')) {
        const now = new Date();
        let time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        let date = `${weekdays[now.getDay()].slice(0,3)}, ${months[now.getMonth()].slice(0,3)} ${now.getDate()}`;
        lockTime.textContent = time;
        lockDate.textContent = date;
    } else if (screen.classList.contains('home')) {
        const now = new Date();
        let time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        homeTime.textContent = time;
    }
}

function unlock() {
    screen.classList.toggle('lock');
    screen.classList.toggle('home');
    buildDate();
};

const fingerprint = document.getElementById('fingerprint')
fingerprint.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    unlock();
});

let dateInterval = setInterval(buildDate, 1000);

buildDate();

homeButton.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if (screen.classList.contains('app-google')) {
        screen.classList.toggle('app-google');
        screen.classList.toggle('home');
        iframeGoogle.src = "";
        buildDate();
    }
});

appGoogle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    screen.classList.toggle('home');
    screen.classList.toggle('app-google');
    iframeGoogle.src= "https://www.google.com/webhp?igu=1"
})
